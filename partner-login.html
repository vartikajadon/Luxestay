<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuxeStay - Restaurant Partner Entrance</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: '#D4AF37',
                        luxe: '#07101E',
                    },
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        jakarta: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        body {
            background: radial-gradient(circle at center, #0B1629 0%, #040A14 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
        }
        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }
        .input-luxe {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(212, 175, 55, 0.2);
            color: #07101E;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .input-luxe:focus {
            border-color: #D4AF37;
            background: #ffffff;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
        }
        .label-luxe {
            position: absolute;
            left: 1.25rem;
            top: 1.1rem;
            color: #64748b;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            z-index: 10;
        }
        .input-luxe:focus + .label-luxe,
        .input-luxe:not(:placeholder-shown) + .label-luxe {
            top: -0.7rem;
            left: 0.8rem;
            font-size: 0.75rem;
            font-weight: 700;
            color: #D4AF37;
            background: #0B1629;
            padding: 0 8px;
            border-radius: 4px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        /* Custom Premium Toast */
        .toast-container {
            position: fixed;
            top: 2rem;
            right: 2rem;
            z-index: 9999;
            pointer-events: none;
        }
        .luxe-toast {
            background: rgba(11, 22, 41, 0.95);
            border-left: 4px solid #D4AF37;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            border-right: 1px solid rgba(212, 175, 55, 0.2);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            transform: translateX(120%);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: auto;
        }
        .luxe-toast.show {
            transform: translateX(0);
        }
    </style>
</head>
<body class="font-jakarta text-white relative overflow-hidden">

    <!-- Ambient background shapes -->
    <div class="absolute top-1/4 -left-20 w-80 h-80 bg-gold/10 rounded-full blur-[100px] animate-float"></div>
    <div class="absolute bottom-1/4 -right-20 w-96 h-96 bg-blue-500/10 rounded-full blur-[100px] animate-float" style="animation-delay: -3s"></div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <div class="w-full max-w-md px-6 relative z-10">
        <!-- Logo Area -->
        <div class="text-center mb-8">
            <a href="index.html" class="inline-block mb-4">
                <img src="public/logo.png" alt="LuxeStay" class="h-16 mx-auto hover:scale-105 transition-transform">
            </a>
            <h1 class="font-cinzel text-2xl tracking-widest text-gold">LUXESTAY</h1>
            <p class="text-gray-400 text-xs uppercase tracking-widest mt-2">Culinary Partner Suite</p>
        </div>

        <!-- Auth Card -->
        <div class="glass-card rounded-3xl p-8 md:p-10">
            <div class="text-center mb-8">
                <h2 class="font-cinzel text-xl text-gold">Partner Verification</h2>
                <p class="text-xs text-gray-400 mt-1">Please enter your culinary license credentials</p>
            </div>

            <!-- Login Form -->
            <form id="partner-login-form" class="space-y-4">
                <div class="input-group">
                    <input type="email" id="partner-email" required class="input-luxe w-full px-5 py-4 rounded-xl placeholder-transparent" placeholder=" ">
                    <label class="label-luxe">Partner Email</label>
                </div>
                <div class="input-group">
                    <input type="password" id="partner-password" required class="input-luxe w-full px-5 py-4 rounded-xl placeholder-transparent" placeholder=" ">
                    <label class="label-luxe">Passphrase</label>
                </div>
                <button type="submit" class="w-full bg-gold hover:bg-yellow-600 text-luxe font-bold py-4 rounded-xl transition-all active:scale-[0.98] flex items-center justify-center gap-3">
                    <span id="btn-text">Access Culinary Portal</span>
                    <i class="ph ph-knife font-bold"></i>
                </button>
            </form>

            <div class="mt-8 text-center border-t border-white/5 pt-6">
                <p class="text-xs text-gray-500 uppercase tracking-widest leading-loose">
                    Secured by Hospitality Encryption<br>
                    &copy; 2026 LuxeStay International
                </p>
            </div>
        </div>
    </div>

    <script>
        const toastContainer = document.getElementById('toast-container');

        function showLuxeToast(message, type = 'error') {
            const toast = document.createElement('div');
            toast.className = 'luxe-toast';
            toast.innerHTML = `
                <div class="flex items-center gap-3">
                    <i class="ph ph-warning-circle text-gold text-2xl"></i>
                    <div>
                        <h4 class="text-gold font-semibold text-sm">Access Denied</h4>
                        <p class="text-gray-300 text-xs mt-0.5">${message}</p>
                    </div>
                </div>
            `;
            toastContainer.appendChild(toast);
            
            // Trigger animation
            setTimeout(() => toast.classList.add('show'), 50);

            // Remove toast after 4 seconds
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, 4000);
        }

        const loginForm = document.getElementById('partner-login-form');
        loginForm.onsubmit = (e) => {
            e.preventDefault();
            const email = document.getElementById('partner-email').value.trim();
            const password = document.getElementById('partner-password').value.trim();
            const btnText = document.getElementById('btn-text');

            btnText.textContent = "Verifying Credentials...";

            if (email === 'partner@luxestay.com' && password === 'partner123') {
                localStorage.setItem("partnerLoggedIn", "true");
                
                // Show success toast first
                showLuxeToast("Credentials accepted. Redirecting to Kitchen Dashboard...", "success");
                
                setTimeout(() => {
                    window.location.href = '/partner-dashboard.html';
                }, 1000);
            } else {
                setTimeout(() => {
                    btnText.textContent = "Access Culinary Portal";
                    showLuxeToast("The security key or partner email is invalid.", "error");
                }, 800);
            }
        };
    </script>
</body>
</html>
