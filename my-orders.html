<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Orders - LuxeStay</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <style>
        .orders-container {
            padding: 120px 24px 60px;
            max-width: 1000px;
            margin: 0 auto;
            min-height: 80vh;
        }
        .orders-header {
            margin-bottom: 40px;
            text-align: center;
        }
        .orders-list {
            display: grid;
            gap: 20px;
        }
        .order-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.1);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }
        .order-info h3 {
            color: var(--accent-color);
            margin-bottom: 8px;
            font-size: 1.1rem;
        }
        .order-items {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-bottom: 10px;
        }
        .order-meta {
            display: flex;
            gap: 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .status-tag {
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .status-preparing { background: rgba(255, 193, 7, 0.1); color: #ffc107; }
        .status-delivered { background: rgba(76, 175, 80, 0.1); color: #4caf50; }
        
        .order-price { text-align: right; }
        .order-price h4 { font-size: 1.3rem; color: #fff; }

        .empty-orders {
            text-align: center;
            padding: 60px;
            color: var(--text-muted);
        }
        .empty-orders i {
            font-size: 4rem;
            margin-bottom: 20px;
            display: block;
            color: rgba(212, 175, 55, 0.2);
        }
    </style>
</head>
<body>
    <nav class="navbar scrolled">
        <div class="nav-brand">
            <a href="index.html"><img src="public/logo.png" alt="LuxeStay" class="nav-logo"></a>
        </div>
        <div class="nav-actions">
            <a href="dashboard.html" class="btn-text" style="color: #fff; text-decoration: none;">Back to Dashboard</a>
        </div>
    </nav>

    <div class="orders-container">
        <div class="orders-header">
            <h1 class="section-title">In-Room Dining History</h1>
            <p class="section-text">Track your culinary requests and past orders.</p>
        </div>

        <div id="orders-list" class="orders-list">
            <!-- Orders will be loaded here -->
        </div>
    </div>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-brand">
                <img src="public/logo.png" alt="LuxeStay">
                <p>Your Stay, Simplified</p>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 LuxeStay. All rights reserved.</p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const ordersList = document.getElementById('orders-list');
            const orders = await LuxeDB.getOrders();

            if (orders.length === 0) {
                ordersList.innerHTML = `
                    <div class="empty-orders">
                        <i class="ph ph-hamburger"></i>
                        <h3>No orders found</h3>
                        <p>You haven't placed any dining orders yet.</p>
                        <a href="dining.html" class="btn-primary" style="display: inline-block; margin-top: 20px; text-decoration: none;">Explore Menu</a>
                    </div>
                `;
            } else {
                orders.forEach(order => {
                    const card = document.createElement('div');
                    card.className = 'order-card';
                    card.innerHTML = `
                        <div class="order-info">
                            <span class="status-tag status-${order.status.toLowerCase()}">${order.status}</span>
                            <h3 style="margin-top: 10px;">Order #${order.id.slice(0, 8)}</h3>
                            <p class="order-items">${order.items}</p>
                            <div class="order-meta">
                                <span><i class="ph ph-calendar"></i> ${new Date(order.created_at).toLocaleDateString()}</span>
                                <span><i class="ph ph-clock"></i> Est. 20 mins</span>
                            </div>
                        </div>
                        <div class="order-price">
                            <span style="font-size: 0.8rem; color: #D4AF37;">Total Amount</span>
                            <h4>$${parseFloat(order.total_price).toFixed(2)}</h4>
                        </div>
                    `;
                    ordersList.appendChild(card);
                });
            }
        });
    </script>
</body>
</html>
