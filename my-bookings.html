<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuxeStay - My Residency Registry</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: '#D4AF37',
                        luxe: '#07101E',
                    },
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        jakarta: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: #07101E;
            color: white;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
        }
        .nav-glass {
            background: rgba(7, 16, 30, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
        }
        .booking-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }
        .booking-card:hover {
            background: rgba(212, 175, 55, 0.05);
            border-color: rgba(212, 175, 55, 0.4);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        .status-badge {
            background: rgba(212, 175, 55, 0.1);
            color: #D4AF37;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body class="bg-luxe">
    <!-- Navbar -->
    <nav class="nav-glass fixed w-full z-50 px-6 py-4 flex justify-between items-center">
        <a href="index.html" class="flex items-center gap-3">
            <img src="public/logo.png" alt="LuxeStay" class="h-10">
            <span class="font-cinzel text-xl tracking-widest text-gold">LUXESTAY</span>
        </a>
        <button onclick="window.location.href='index.html'" class="text-gray-400 hover:text-gold transition-colors flex items-center gap-2">
            <i class="ph ph-arrow-left"></i> Return to Discovery
        </button>
    </nav>

    <main class="pt-32 pb-20 px-6 max-w-6xl mx-auto">
        <div class="mb-12 text-center">
            <h1 class="font-cinzel text-4xl md:text-5xl text-white mb-4">Your Residency Registry</h1>
            <p class="text-gray-400 max-w-2xl mx-auto">A curation of your curated stays and future legacies with LuxeStay.</p>
        </div>

        <div id="bookings-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Loading State -->
            <div class="col-span-full text-center py-20 opacity-50">
                <i class="ph ph-spinner ph-spin text-4xl text-gold mb-4"></i>
                <p>Retrieving your residencies...</p>
            </div>
        </div>
    </main>

    <script type="module">
        import { LuxeDB } from './supabase-config.js';
        import { Toast } from './toast.js';

        async function init() {
            const user = await LuxeDB.getUser();
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            const bookingsGrid = document.getElementById('bookings-grid');
            try {
                const bookings = await LuxeDB.getBookings();

                if (!bookings || bookings.length === 0) {
                    bookingsGrid.innerHTML = `
                        <div class="col-span-full text-center py-20">
                            <div class="mb-6 inline-block p-6 rounded-full bg-white/5">
                                <i class="ph ph-calendar-x text-5xl text-gray-600"></i>
                            </div>
                            <h2 class="text-2xl font-cinzel text-white mb-2">No Residency Found</h2>
                            <p class="text-gray-400 mb-8">You haven't curated any stays with us yet.</p>
                            <a href="index.html" class="bg-gold text-luxe px-8 py-3 rounded-xl font-bold hover:bg-yellow-600 transition-all">
                                Discover Our Properties
                            </a>
                        </div>
                    `;
                    return;
                }

                bookingsGrid.innerHTML = '';
                bookings.forEach(booking => {
                    const card = document.createElement('div');
                    card.className = 'booking-card p-6 rounded-2xl flex flex-col gap-4';
                    
                    // Format dates
                    const checkIn = new Date(booking.check_in).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                    
                    card.innerHTML = `
                        <div class="flex justify-between items-start">
                            <span class="status-badge">Confirmed Stay</span>
                            <i class="ph ph-identification-card text-gold text-2xl"></i>
                        </div>
                        <div>
                            <h3 class="font-cinzel text-xl text-white mb-1">${booking.hotel_name || 'Premium Property'}</h3>
                            <p class="text-gray-400 text-sm flex items-center gap-2">
                                <i class="ph ph-map-pin"></i> Luxury Destination
                            </p>
                        </div>
                        <div class="mt-4 pt-4 border-t border-white/5 flex justify-between items-center">
                            <div>
                                <p class="text-[10px] uppercase tracking-widest text-gray-500 mb-1">Check In</p>
                                <p class="text-sm font-semibold text-white">${checkIn}</p>
                            </div>
                            <div class="text-right">
                                <p class="text-[10px] uppercase tracking-widest text-gray-500 mb-1">Room</p>
                                <p class="text-sm font-semibold text-gold">${booking.room_number || booking.room || 'Assigning...'}</p>
                            </div>
                        </div>
                    `;

                    card.onclick = () => {
                        Toast.show(`Opening Dashboard for ${booking.hotel_name}...`, "success");
                        setTimeout(() => {
                            window.location.href = `dashboard.html?id=${booking.id}`;
                        }, 1000);
                    };

                    bookingsGrid.appendChild(card);
                });

            } catch (error) {
                console.error("Registry Error:", error);
                Toast.show("Failed to retrieve residencies.", "error");
            }
        }

        init();
    </script>
</body>
</html>
